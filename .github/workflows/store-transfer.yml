name: Store transfer
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: store-transfer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  transfer:
    name: ${{ matrix.source }} to ${{ matrix.target }} (${{ matrix.mode || 'normal' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: sqlite
            target: pg
          - source: sqlite
            target: mysql
          - source: pg
            target: sqlite
          - source: pg
            target: mysql
          - source: mysql
            target: sqlite
          - source: mysql
            target: pg
          - source: sqlite
            target: pg
            mode: activation-crash
          - source: sqlite
            target: mysql
            mode: activation-crash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: Install pinned Bun
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 --output bun.zip \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          printf '%s\n' '2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452  bun.zip' | sha256sum --check -
          unzip -q bun.zip
          printf '%s\n' "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Install locked acceptance dependencies
        run: |
          test "$(node --version)" = v22.22.3
          test "$(bun --version)" = 1.4.0
          bun install --frozen-lockfile
      - name: Build immutable image with actual transfer command
        run: docker build --platform linux/amd64 --tag comms:transfer-acceptance .
      - name: Transfer and reopen the board across engines
        run: bash scripts/transfer-acceptance.sh '${{ matrix.source }}' '${{ matrix.target }}' comms:transfer-acceptance '${{ matrix.mode || 'normal' }}'
