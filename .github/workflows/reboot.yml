name: Guest kernel reboot

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: guest-reboot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 --output bun.zip \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          printf '%s\n' '2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452  bun.zip' | sha256sum --check -
          unzip -q bun.zip
          printf '%s\n' "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Build real runtime
        run: |
          test "$(node --version)" = 'v22.22.3'
          test "$(bun --revision)" = '1.4.0+34cbb9a40'
          bun install --frozen-lockfile
          bun run build
      - name: Install guest tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils cloud-image-utils ovmf acl
          # The runner user may not belong to the device's kvm group.
          if test -e /dev/kvm; then
            ls -l /dev/kvm
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          else
            echo 'No /dev/kvm device; guest will use software emulation'
          fi
          qemu-system-x86_64 --version
          dpkg-query -W qemu-system-x86 qemu-utils cloud-image-utils ovmf
      - name: Verify acknowledged writes across guest hard reset
        run: bash scripts/reboot-vm.sh
